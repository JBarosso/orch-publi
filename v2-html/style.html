<style>

    .hp-cat-header__container {

        }

        }

            grid-column: span 3;
        }
    }
  
    .hp-cat-header-meas>*:nth-child(2n + 1) {
        @media (max-width: 639.9px) {
            grid-row: span 5;
        }
    }

        display: grid;
        overflow: hidden;
        grid-template-rows: 1fr auto;
        grid-template-columns: 100%;
        border-radius: 8px;
        background-color: #efefef;

            grid-row: span 4;
        }
  
        @media (min-width: 767px) {
            grid-column: span 2;
        }

        grid-column: 1/-1;

        width: 100%;

        width: 100%;

        }

        grid-column: 1/-1;

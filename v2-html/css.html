<style>
  /* GLOBAL */
  .hp-cat-container {
    width: calc(100% - 48px);
    margin: auto;
    color: var(--o-primary);
  }

  .experience-component > .container {
    max-width: 100%;
  }

  /* FIL ARIANE */
  .hp-cat-filariane {
    margin-block: 16px;
  }

  .hp-cat-filariane_container {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    flex-flow: row nowrap;
    gap: 12px;
  }

  .hp-cat-filariane__title {
    font-size: clamp(1.25rem, 1.556vw + 0.504rem, 1.5rem);
    font-weight: 600;
    line-height: 1.2;
    margin: 0;
  }

  .hp-cat-filariane__list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    flex-flow: row nowrap;
    gap: 12px;
    width: fit-content;
    overflow-y: auto;
    width: 100%;
    position: relative;
  }

  .hp-cat-filariane__list::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: 24px;
    pointer-events: none;
    z-index: 1;
    background: linear-gradient(to left, white 10%, rgba(255, 255, 255, 0.5));
  }

  .hp-cat-filariane__link {
    display: block;
    font-weight: 400;
    text-decoration: none;
    font-size: 13px;
    padding: 4px 12px 2px 12px;
    line-height: 1.4;
    border: 1px solid var(--o-primary);
    border-radius: var(--o-radius-sm);
    transition:
      background-color 0.3s ease-in-out,
      color 0.3s ease-in-out;
  }

  .hp-cat-filariane__link:focus-visible {
    outline: 2px solid var(--o-primary);
    outline-offset: 3px;
  }

  .hp-cat-filariane__link:hover {
    background-color: var(--o-primary);
    color: #fff;
    text-decoration: none;
  }

  /* HEADER */
  .hp-cat-header__container {
    display: flex;
    flex-flow: row wrap;
    gap: 16px;

    @media (max-width: 639.9px) {
      flex-direction: column;
    }
  }

  .hp-cat-header-meas {
    display: grid;
    gap: 16px;
    flex: 2;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(2, 1fr);

    @media (max-width: 767px) {
      grid-template-columns: repeat(2, 1fr);
    }

    @media (max-width: 639.9px) {
      grid-template-rows: repeat(5, 1fr);
    }
  }

  .hp-cat-header-meas > *:nth-child(3n + 1) {
    @media (min-width: 766.9px) {
      grid-column: span 3;
    }
  }

  .hp-cat-header-meas > *:nth-child(2n + 1) {
    @media (max-width: 639.9px) {
      grid-row: span 3;
    }
  }

  .hp-cat-header-mea {
    position: relative;
    display: grid;
    overflow: hidden;
    grid-template-rows: 1fr auto;
    grid-template-columns: 100%;
    border-radius: 8px;
    background-color: #efefef;

    @media (min-width: 640px) {
      height: clamp(14.313rem, 43.969vw - 6.765rem, 21.375rem);
    }

    @media (max-width: 639.9px) {
      grid-row: span 2;
    }

    @media (min-width: 767px) {
      grid-column: span 2;
    }
  }

  .hp-cat-header-mea__picture,
  .hp-cat-header-mea__video {
    grid-row: 1/-1;
    grid-column: 1/-1;
    position: relative;
    z-index: 0;
    transition: all 0.3s ease-in-out;
  }

  .hp-cat-header-mea:has(.hp-cat-header__link:hover) {
    .hp-cat-header-mea__picture,
    .hp-cat-header-mea__video {
      scale: 1.05;
    }
  }

  .hp-cat-header-mea__picture {
    height: 100%;
    width: 100%;
  }

  .hp-cat-header-mea__video,
  .hp-cat-header-mea__img {
    height: 100%;
    width: 100%;
    object-fit: cover;
  }

  .hp-cat-header-mea__container {
    z-index: 2;
    grid-row: 2/-1;
    grid-column: 1/-1;
    padding: 24px clamp(1rem, 3.113vw - 0.492rem, 1.5rem);
    color: #fff;
  }

  .hp-cat-header-mea__title {
    font-size: 20px;
    text-transform: uppercase;
    font-weight: 900;
    margin-bottom: 6px;
  }

  .hp-cat-header-mea__buttons {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    flex-flow: row wrap;
    gap: 8px;
  }

  .hp-cat-header-mea__button {
    position: relative;
    z-index: 2;
    line-height: 1.4;
    font-size: 13px;
    color: var(--o-primary);
    border: 1px solid var(--o-neutral-50);
    background-color: var(--o-neutral-50);
    border-radius: var(--o-radius-sm);
    padding: 4px 12px;
    text-decoration: none;
    text-align: center;
    transition:
      background-color 0.3s ease-in-out,
      color 0.3s ease-in-out,
      border-color 0.3s ease-in-out;
  }

  .hp-cat-header-mea__button:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
  }

  .hp-cat-header-mea__button:hover {
    text-decoration: none;
    color: var(--o-neutral-50);
    background-color: transparent;
  }

  .hp-cat-header__link {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  .hp-cat-header--focus {
    flex: 1;
    min-height: clamp(29.688rem, 87.549vw - 12.281rem, 43.75rem);
  }

  /* QUICKACCESS */
  .quickaccess-v2 {
    padding: clamp(2rem, 12.451vw - 3.969rem, 4rem) 0;
    border-bottom: 1px solid var(--o-neutral-400);
    overflow-y: hidden;
  }

  .quickaccess-v2__list {
    display: flex;
    flex-wrap: nowrap;
    justify-content: center;
    gap: var(--o-spacing-md);
    width: fit-content;
    margin: auto;
    padding: 0;
    list-style: none;
  }

  .quickaccess-v2-item {
    position: relative;
    display: grid;
    grid-template-rows: 1fr auto;
    grid-template-columns: 100%;
    width: min-content;
    min-width: clamp(7.125rem, 28.794vw - 6.678rem, 11.75rem);
    min-height: clamp(9.813rem, 50.195vw - 14.25rem, 17.875rem);
    box-shadow: 0 1px 3px 0px rgba(0, 0, 0, 0.2);
    border-radius: var(--o-radius-lg);
    overflow: hidden;
    transition:
      transform 0.3s ease-in-out,
      box-shadow 0.3s ease-in-out;
  }

  .quickaccess-v2-item:focus-visible {
    outline: 2px solid var(--o-primary);
    outline-offset: 3px;
  }

  .quickaccess-v2-item:hover {
    text-decoration: none;
    transform: translateY(-6px);
  }

  .quickaccess-v2-item__picture {
    grid-row: 1/-1;
    grid-column: 1/-1;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .quickaccess-v2-item__img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .quickaccess-v2-item__label {
    grid-row: 2/-1;
    grid-column: 1/-1;
    font-weight: 400;
    font-size: var(--o-fs-text-xs);
    line-height: 1.4;
    padding: var(--o-spacing-2xs);
    text-align: center;
    border-radius: var(--o-radius-sm);
    background-color: var(--o-neutral-50);
    width: calc(100% - 24px);
    margin: 0 auto 12px auto;
  }

  /* Bloc Edito */
  :root {
    --edito-radius: 16px;
    --edito-padding: 20px;
    --edito-img-height: 210px;
    --edito-card-height: 450px; 
    --edito-gap: 24px;

    /* Thèmes */
    --edito-theme-club: #e32638;
    --edito-theme-grandtirage: #f7efdd;
    --edito-theme-mcm: #ffecdb;
    --edito-theme-application: #f6d0cc;
    --edito-theme-beige: #f3f0e6;
    --edito-theme-transparent: transparent;
  }

  .edito-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: var(--edito-gap);
    width: calc(100% - 48px);
    margin-inline: auto;
    padding-block: clamp(2rem, 5vw, 3rem);
  }

  .edito-card {
    position: relative;
    display: flex;
    flex-direction: column;
    border-radius: var(--edito-radius);
    overflow: hidden;
    background-color: var(--edito-bg, var(--o-neutral-100, #f5f5f5));
    color: var(--edito-color, var(--o-primary, #262626));
  }

  .edito-card__media {
    position: relative;
    flex-shrink: 0;
    overflow: hidden;
  }

  .edito-card__picture {
    display: block;
    width: 100%;
  }

  .edito-card__img {
    display: block;
    width: 100%;
    height: var(--edito-img-height);
    object-fit: cover;
  }

  .edito-card__overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: var(--edito-padding);
    text-align: center;
    color: #fff;
  }

  .edito-card__overlay-logo {
    width: clamp(64px, 25%, 86px);
    margin-bottom: 4px;
  }

  .edito-card__overlay-kicker {
    font-size: clamp(2.5rem, 8vw, 3.75rem);
    font-weight: 800;
    line-height: 1;
  }

  .edito-card__overlay-subtitle {
    font-size: clamp(0.875rem, 2.5vw, 1.1875rem);
    font-weight: 700;
    line-height: 1.3;
    text-transform: uppercase;
  }

  .edito-card__overlay-asset {
    position: absolute;
  }

  .edito-card__overlay-asset--heart {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -55%);
    height: clamp(120px, 35%, 160px);
  }

  .edito-card__overlay-asset--lisbonne {
    bottom: 110px;
    right: 24px;
    height: 56px;
  }

  .edito-card__body {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: var(--edito-padding);
  }

  .edito-card__title {
    font-size: clamp(1rem, 2.5vw, 1.125rem);
    font-weight: 700;
    line-height: 1.3;
    margin: 0;
  }

  .edito-card__text {
    font-size: 0.875rem;
    line-height: 1.5;
    margin: 0;
  }

  .edito-card__body--inset {
    position: absolute;
    inset: auto 0 0 0;
    padding: var(--edito-padding) var(--edito-padding) 0;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    overflow: hidden;
    white-space: nowrap;
    width: 1px;
    height: 1px;
  }

  .edito-card__actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: var(--edito-padding);
    padding-top: 4px;
  }

  .edito-card__actions--inset {
    position: absolute;
    bottom: var(--edito-padding);
    left: var(--edito-padding);
    padding: 0;
  }

  .edito-card__btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 24px;
    border-radius: 100px;
    font-size: 0.9375rem;
    font-weight: 600;
    line-height: 1.2;
    text-decoration: none;
    border: 2px solid transparent;
    cursor: pointer;
    transition:
      background-color 0.25s ease,
      color 0.25s ease,
      border-color 0.25s ease;
    position: relative;
    z-index: 2; 
  }

  .edito-card__btn--primary {
    background-color: #fff;
    color: var(--o-primary, #262626);
    border-color: #fff;
  }

  .edito-card__btn--primary:hover {
    background-color: transparent;
    color: #fff;
    text-decoration: none;
  }

  .edito-card__btn--secondary {
    background-color: transparent;
    color: var(--o-primary, #262626);
    border-color: var(--o-primary, #262626);
  }

  .edito-card__btn--secondary:hover {
    background-color: var(--o-primary, #262626);
    color: #fff;
    text-decoration: none;
  }

  .edito-card__btn--dark {
    background-color: #262626;
    color: #fff;
    border-color: #262626;
  }

  .edito-card__btn--dark:hover {
    background-color: transparent;
    color: #262626;
    text-decoration: none;
  }

  .edito-card__link {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  .edito-card--overlay-full .edito-card__media,
  .edito-card--full-image .edito-card__media {
    flex: 1;
  }

  .edito-card--overlay-full .edito-card__img,
  .edito-card--full-image .edito-card__img {
    height: var(--edito-card-height);
  }

  [data-theme="club"] {
    --edito-bg: var(--edito-theme-club);
    --edito-color: #fff;
  }

  [data-theme="grandtirage"] {
    --edito-bg: var(--edito-theme-grandtirage);
    --edito-color: var(--o-primary, #262626);
  }

  [data-theme="mcm"] {
    --edito-bg: var(--edito-theme-mcm);
    --edito-color: var(--o-primary, #262626);
  }

  [data-theme="application"] {
    --edito-bg: var(--edito-theme-application);
    --edito-color: var(--o-primary, #262626);
  }

  [data-theme="beige"] {
    --edito-bg: var(--edito-theme-beige);
    --edito-color: var(--o-primary, #262626);
  }

  [data-theme="transparent"] {
    --edito-bg: var(--edito-theme-transparent);
    --edito-color: var(--o-primary, #262626);
  }

  .edito-card__btn:focus-visible,
  .edito-card a:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 3px;
  }

  @media (min-width: 1200px) {
    .edito-grid {
      grid-template-columns: repeat(3, minmax(0, 370px));
      justify-content: center;
    }
  }

  /* Sur mobile : image un peu moins haute sur variante standard */
  @media (max-width: 767px) {
    :root {
      --edito-img-height: 180px;
      --edito-card-height: 380px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .edito-card__btn,
    .hp-cat-filariane__link,
    .hp-cat-header-mea__button,
    .quickaccess-v2-item {
      transition: none;
    }

    .quickaccess-v2-item:hover {
      transform: none;
    }
  }
</style>
